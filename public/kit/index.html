<!doctype html>
<!-- The contents page: every step in script.js, in order, each linked to its screen. -->
<html lang="en-GB">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Survey kit</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="preview.css">
<script src="script.js"></script>
<script src="nav.js"></script>
<script src="frame.js"></script>
<style>
.ix-page { height: calc(100dvh - var(--pvb)); display: flex; justify-content: center; padding: 10px 0;
  background: radial-gradient(1200px 500px at 50% 110%, rgba(79,163,106,0.10), transparent 70%), var(--paper); }
.ix-frame { width: 940px; max-width: calc(100vw - 40px); height: min(750px, 100%); display: flex; flex-direction: column; overflow: hidden;
  background: var(--paper); border: 1px solid var(--rule-soft); border-radius: 4px; box-shadow: 0 18px 50px rgba(13,12,11,0.10); }

.ix-head { flex: none; padding: 22px 44px 0; }
.ix-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.ix-mast { display: flex; align-items: center; gap: 12px; }
.ix-mast svg { display: block; }
.ix-name { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: 0.02em; color: var(--ink); }
.ix-clear { font-size: 12px; }
.ix-own { display: flex; gap: 16px; align-items: center; }
.ix-intro { margin: 8px 0 0; max-width: 720px; font-size: 16px; line-height: 23px; color: var(--ink-2); text-wrap: pretty; }

/* the two experiences, side by side; the chosen one's screens are listed below */
.ix-cards { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 44px; border-bottom: 1px solid var(--rule-soft); }
.ix-card { --c: var(--accent-deep); display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 12px; background: #fff; cursor: pointer;
  border: 1.5px solid var(--rule-soft); border-radius: 6px; transition: border-color 150ms, box-shadow 150ms; }
.ix-card[data-tab="game"] { --c: var(--navy); }
.ix-card:hover { border-color: var(--rule); }
.ix-card.on { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 14%, transparent); }
.ix-shot { width: 150px; height: 150px; object-fit: cover; object-position: top; display: block; border: 1px solid var(--rule-soft); border-radius: 3px; }
.ix-cb { display: flex; flex-direction: column; min-width: 0; }
.ix-ck { margin: 0; font-family: var(--font-ui); font-weight: 600; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--c); }
.ix-cn { margin: 2px 0 4px; font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.05; color: var(--ink); }
.ix-cd { margin: 0; font-family: var(--font-text); font-size: 14px; line-height: 19px; color: var(--ink-2); text-wrap: pretty; }
.ix-cm { margin: 6px 0 0; font-family: var(--font-ui); font-size: 12px; color: var(--muted); }
.ix-ca { display: flex; align-items: center; gap: 14px; margin-top: auto; padding-top: 10px; }
.ix-ca .ix-start { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; min-width: 0; min-height: 36px; padding: 0 18px; font-size: 14px; background: var(--c); }
.ix-see { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--font-ui); font-size: 12.5px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.ix-see[aria-selected="true"] { color: var(--c); font-weight: 600; text-decoration: none; }
.ix-see:focus-visible, .ix-card:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
.ix-lh { flex: none; margin: 0; padding: 14px 44px 0; font-family: var(--font-ui); font-weight: 600; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); }
.ix-lh span { color: var(--muted); font-weight: 500; letter-spacing: 0.04em; text-transform: none; margin-left: 6px; }
.ix-list[hidden] { display: none; }
.ix-row .tpl .ph { color: var(--bronze); }
.ix-empty { padding: 22px 0; font-family: var(--font-text); font-size: 15.5px; color: var(--muted); }
.ix-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 44px 28px; scrollbar-width: thin; scrollbar-color: var(--rule-soft) transparent; }
.ix-ch { display: flex; align-items: baseline; gap: 0; margin: 22px 0 4px; padding-bottom: 6px; border-bottom: 1px solid var(--rule-soft); text-decoration: none; color: var(--ink); }
.ix-ch:first-child { margin-top: 14px; }
.ix-ch .n { width: 58px; flex: none; font-family: var(--font-display); font-weight: 500; font-size: 20px; letter-spacing: 0.06em; color: var(--bronze); }
.ix-ch .nm { flex: 1; font-family: var(--font-ui); font-weight: 600; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; }
.ix-ch .mn { font-family: var(--font-ui); font-size: 12px; color: var(--muted); }
.ix-ch:hover .nm { text-decoration: underline; text-underline-offset: 4px; }

.ix-row { display: grid; grid-template-columns: 58px 1fr auto; gap: 0 14px; align-items: baseline; padding: 6px 0; text-decoration: none; color: var(--ink); border-bottom: 1px dotted rgba(140,133,122,0.35); }
.ix-row:hover { background: rgba(214,235,217,0.18); }
.ix-row:hover .tx { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.ix-row .id { font-family: var(--font-display); font-size: 15px; color: var(--ink-2); font-variant-numeric: lining-nums; white-space: nowrap; }
.ix-row .tx { font-family: var(--font-text); font-size: 15.5px; line-height: 22px; }
.ix-row .cond { display: block; font-style: italic; font-size: 13px; line-height: 18px; color: var(--rule); }
.ix-row .br { color: var(--forest); }
.ix-row .mt { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.ix-row .tpl { font-family: var(--font-ui); font-size: 11px; color: var(--rule); letter-spacing: 0.02em; min-width: 92px; text-align: right; }
.ix-row .pv-chip { max-width: 230px; vertical-align: baseline; }
.ix-row.fu { padding-left: 26px; grid-template-columns: 58px 1fr auto; }
.ix-row.fu .id { font-size: 14px; color: var(--muted); }
.ix-row.fu .tx { font-size: 15px; color: var(--ink-2); }
.ix-row.other .tx { font-style: italic; color: var(--muted); }
.ix-row.other .id { color: var(--muted); font-size: 13px; }

@media (min-width: 701px) and (max-height: 720px) {
  .ix-page { padding: 8px 0; }
  .ix-head { padding: 16px 40px 0; }
  .ix-name { font-size: 28px; }
  .ix-intro { margin-top: 6px; font-size: 15px; line-height: 21px; }
  .ix-cards { padding: 12px 40px; gap: 12px; }
  .ix-card { grid-template-columns: 112px 1fr; padding: 10px; }
  .ix-shot { width: 112px; height: 112px; }
  .ix-cn { font-size: 22px; }
  .ix-cd { font-size: 13px; line-height: 17px; }
  .ix-cm { display: none; }
  .ix-lh { padding: 10px 40px 0; }
}
@media (max-width: 700px) {
  .ix-page { padding: 0; }
  .ix-frame { width: 100%; max-width: none; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
  .ix-head { padding: 14px 20px 0; }
  .ix-name { font-size: 24px; }
  .ix-intro { font-size: 14px; line-height: 19px; margin-top: 6px; }
  .ix-cards { gap: 10px; padding: 12px 20px; }
  .ix-card { grid-template-columns: 1fr; gap: 8px; padding: 8px; }
  .ix-shot { width: 100%; height: 78px; }
  .ix-ck, .ix-cd, .ix-cm { display: none; }
  .ix-cn { font-size: 20px; margin: 0; }
  .ix-ca { flex-direction: column; align-items: stretch; gap: 6px; padding-top: 6px; }
  .ix-ca .ix-start { width: 100%; min-height: 34px; padding: 0 8px; }
  .ix-see { text-align: center; }
  .ix-lh { padding: 10px 20px 0; }
  .ix-list { padding: 0 20px 20px; }
  .ix-row, .ix-row.fu { grid-template-columns: 44px 1fr; }
  .ix-row.fu { padding-left: 14px; }
  .ix-row .mt { grid-column: 2; margin-top: 2px; }
  .ix-row .tpl { min-width: 0; text-align: left; }
  .ix-ch .n { width: 44px; }
}
</style>
</head>
<body class="pv pv-index">
<div class="pv-banner" role="note"><span class="pv-b-t" id="banner"></span><span class="pv-b-r"><span class="pv-id">Contents</span></span></div>
<div class="ix-page">
  <div class="ix-frame">
    <header class="ix-head">
      <div class="ix-top">
        <div class="ix-mast" id="mast"><h1 class="ix-name" id="name"></h1></div>
        <div class="ix-own"><a class="c-link ix-clear" id="results" href="/results">Results</a><button class="c-link ix-clear" type="button" id="clear">Clear my answers</button></div>
      </div>
      <p class="ix-intro" id="intro"></p>
    </header>
    <div class="ix-cards" role="tablist" aria-label="Two survey experiences">
      <section class="ix-card on" data-tab="quiz">
        <img class="ix-shot" src="img/quiz.png" alt="A quiz-style screen: a card to sort into one of four piles">
        <div class="ix-cb">
          <p class="ix-ck">Experience 1</p>
          <h2 class="ix-cn">Quiz-style</h2>
          <p class="ix-cd" id="descQuiz"></p>
          <p class="ix-cm" id="countsQuiz"></p>
          <div class="ix-ca"><a class="c-next ix-start" id="startQuiz" href="#">Start</a><button class="ix-see" role="tab" id="tabQuiz" aria-controls="list" aria-selected="true"></button></div>
        </div>
      </section>
      <section class="ix-card" data-tab="game">
        <img class="ix-shot" src="img/game.png" alt="A game-style screen: jugs pouring hours into a bottle, in a misty landscape">
        <div class="ix-cb">
          <p class="ix-ck">Experience 2</p>
          <h2 class="ix-cn">Game-style</h2>
          <p class="ix-cd" id="descGame"></p>
          <p class="ix-cm" id="countsGame"></p>
          <div class="ix-ca"><a class="c-next ix-start" id="startGame" href="#">Start</a><button class="ix-see" role="tab" id="tabGame" aria-controls="glist" aria-selected="false" tabindex="-1"></button></div>
        </div>
      </section>
    </div>
    <p class="ix-lh" id="listHead"></p>
    <nav class="ix-list" id="list" role="tabpanel" aria-labelledby="tabQuiz"></nav>
    <nav class="ix-list" id="glist" role="tabpanel" aria-labelledby="tabGame" hidden></nav>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" style="position:fixed"></div>
<script>
(function () {
  'use strict'
  const N = window.SurveyNav, P = window.SurveyFrame, S = window.SURVEY
  const esc = P.esc, glue = P.glue
  const $ = (s) => document.querySelector(s)

  $('#mast').insertAdjacentHTML('afterbegin', P.markSVG(34, 34))
  const K = S.kit || {}, G = S.game || {}
  $('#name').textContent = K.title || 'Survey kit'
  $('#banner').textContent = P.BANNER
  // the results page needs the server; opened from a folder there is none
  if (location.protocol === 'file:') $('#results').hidden = true
  $('#intro').textContent = K.intro || ''
  $('#descQuiz').textContent = S.intro || ''
  $('#descGame').textContent = G.intro || ''
  $('#startQuiz').href = N.href(N.steps[0])
  $('#startGame').href = G.start || G.href || '#'
  const count = (k) => N.steps.filter((s) => s.kind === k).length
  const quizCounts = `${count('question')} questions · ${count('followup')} follow-ups · ${S.chapters.length} chapters`
  $('#countsQuiz').textContent = quizCounts
  $('#clear').onclick = () => {
    N.answers.clearAll()
    try { (S.game && S.game.storageKeys || []).forEach((k) => localStorage.removeItem(k)) } catch (e) {}
    const t = $('#toast'); t.textContent = 'Your answers are cleared.'; t.classList.add('on')
    setTimeout(() => t.classList.remove('on'), 2400)
  }

  const label = (s) => {
    if (s.kind === 'welcome') return 'Welcome'
    if (s.kind === 'pause') return `Pause card: “${s.data.line}”`
    if (s.kind === 'ending') return 'Ending and contact line'
    return s.question || s.title
  }
  const row = (s) => {
    const cls = s.kind === 'followup' ? 'fu' : (s.kind === 'question' || s.kind === 'statement') ? '' : 'other'
    const cond = s.previewCondition ? `<span class="cond">${esc(s.previewCondition)}</span>` : ''
    const num = s.kind === 'question' || s.kind === 'followup' || s.kind === 'statement' ? s.id : ''
    const bridge = s.bridge && s.question ? `<span class="br">${glue(s.bridge)}</span> ` : ''
    return `<a class="ix-row ${cls}" href="${N.href(s)}"><span class="id">${esc(num)}</span><span class="tx">${bridge}${glue(label(s))}${cond}</span><span class="mt"><span class="tpl">${esc(s.template)}${s.data && s.data.skin ? ' · ' + esc(s.data.skin) : ''}${s.data && s.data.mode ? ' · ' + esc(s.data.mode) : ''}</span></span></a>`
  }

  let html = ''
  let chap = undefined
  N.steps.forEach((s) => {
    if (s.kind === 'break') {
      const c = N.chapter(s)
      html += `<a class="ix-ch" href="${N.href(s)}"><span class="n">${esc(c.numeral)}</span><span class="nm">${esc(c.name)}</span><span class="mn">about ${c.minutes} min</span></a>`
      chap = c.numeral
      return
    }
    if (chap === undefined && s.chapter == null && s.kind !== 'ending') {
      html += `<div class="ix-ch" style="cursor:default"><span class="n"></span><span class="nm">Opening</span><span class="mn"></span></div>`
      chap = null
    }
    if (s.kind === 'ending') html += `<div class="ix-ch" style="cursor:default"><span class="n"></span><span class="nm">Close</span><span class="mn"></span></div>`
    html += row(s)
  })
  $('#list').innerHTML = html

  /* ---------------- the game-style tab: its screens come from the site (SURVEY.game.screens) ---------------- */
  let gameCounts = '', gameLoaded = false
  const narrow = window.matchMedia('(max-width: 700px)').matches
  function loadGame() {
    if (gameLoaded) return
    gameLoaded = true
    // opened from a folder there is no site to ask: say where the game-style screens run, without a failed request
    const offline = () => { $('#glist').innerHTML = `<p class="ix-empty">${esc(G.offline || '')}</p>`; $('#countsGame').textContent = G.offlineShort || '' }
    if (location.protocol === 'file:') { offline(); return }
    fetch(G.screens).then((r) => r.json()).then(({ rows }) => {
      const at = (id) => (id === 'start' ? G.href : `${G.href}?at=${encodeURIComponent(id)}`)
      let h = ''
      rows.forEach((r) => {
        if (r.kind === 'break') { h += `<a class="ix-ch" href="${esc(at(r.id))}"><span class="n"></span><span class="nm">${esc(r.text)}</span><span class="mn"></span></a>`; return }
        const cls = r.kind === 'followup' ? 'fu' : r.kind === 'scene' ? 'other' : ''
        const id = r.kind === 'scene' ? '' : r.id
        const br = r.bridge ? `<span class="br">${glue(r.bridge)}</span> ` : ''
        const cond = r.when ? `<span class="cond">${esc(r.when)}</span>` : ''
        const ph = r.phone ? '' : ' · <span class="ph">laptop only</span>'
        // a phone never asks the laptop-only screens, so on a phone they are listed but not linked
        const tag = !r.phone && narrow ? 'div' : 'a'
        h += `<${tag} class="ix-row ${cls}"${tag === 'a' ? ` href="${esc(at(r.id))}"` : ''}><span class="id">${esc(id)}</span><span class="tx">${br}${glue(r.text)}${cond}</span><span class="mt"><span class="tpl">${esc(r.look)}${ph}</span></span></${tag}>`
      })
      $('#glist').innerHTML = h
      const q = rows.filter((r) => r.kind === 'question').length, f = rows.filter((r) => r.kind === 'followup').length
      gameCounts = `${q} questions · ${f} follow-ups · ${rows.filter((r) => r.kind === 'break').length} sections`
      $('#countsGame').textContent = gameCounts
    }).catch(offline)
  }

  let tab = 'quiz'
  const L = K.lists || {}
  function show(which, focus) {
    tab = which
    const game = which === 'game'
    document.querySelectorAll('.ix-card').forEach((c) => c.classList.toggle('on', c.dataset.tab === which))
    $('#tabQuiz').setAttribute('aria-selected', String(!game)); $('#tabQuiz').tabIndex = game ? -1 : 0
    $('#tabGame').setAttribute('aria-selected', String(game)); $('#tabGame').tabIndex = game ? 0 : -1
    $('#tabQuiz').textContent = game ? (L.see || '') : (L.showing || '')
    $('#tabGame').textContent = game ? (L.showing || '') : (L.see || '')
    $('#list').hidden = game; $('#glist').hidden = !game
    $('#listHead').innerHTML = `${esc(game ? L.game : L.quiz)}<span>${esc(L.hint || '')}</span>`
    if (focus) (game ? $('#tabGame') : $('#tabQuiz')).focus()
    try { history.replaceState(null, '', game ? '#game' : location.pathname + location.search) } catch (e) {}
  }
  document.querySelectorAll('.ix-card').forEach((c) => c.addEventListener('click', (e) => {
    if (e.target.closest('a')) return
    show(c.dataset.tab)
  }))
  document.querySelector('.ix-cards').addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey || !e.target.matches('[role="tab"]')) return
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); show(tab === 'quiz' ? 'game' : 'quiz', true) }
  })
  show(location.hash === '#game' ? 'game' : 'quiz')
  loadGame()
  if (location.hash === '#game') show('game')
  window.addEventListener('hashchange', () => show(location.hash === '#game' ? 'game' : 'quiz'))

  document.addEventListener('keydown', (e) => { if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); location.href = (tab === 'game' ? $('#startGame') : $('#startQuiz')).href } })
})()
</script>
</body>
</html>
